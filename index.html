function head(r){const s=cur('stringJobs',r.id),g=cur('overgripJobs',r.id);return `<div class=c><div class=cd>${r.photoId?ph(r,'rp z'):'<div class="rp ph0">no photo</div>'}<div class=cb><b style="font-size:18px">${esc(r.name)}</b><p><b>${fh(H(e=>e.racketId==r.id))}</b> total${since(r)}</p>${r.sport=='padel'?'':`<p>${s?ln(snm(s),H(e=>e.stringJobId==s.id),s):'<span class=m>No strings yet</span>'}</p><p>${g?ln(g.model,H(e=>e.overgripJobId==g.id),g):'<span class=m>No overgrip</span>'}</p>`}</div></div></div>`}
function detail(id){const r=R(id),E=db.entries.filter(e=>e.racketId==id),ed=x=>`<span class=m style="float:right">✎</span>`;let body;
if(tab=='S'){const L=E.filter(isS).sort((a,b)=>b.date>a.date?1:b.date<a.date?-1:((b.createdAt||'')>(a.createdAt||'')?1:-1));
body=L.slice(0,sl).map(e=>{const g=e.sessionId?db.entries.filter(x=>x.sessionId==e.sessionId):[e],o=g.filter(x=>x!=e).map(x=>esc(R(x.racketId)?.name)).join(', ');return `<div class="tl ti" onclick="editE('${e.id}')">${ph(e,'th z')}<div class=tt>${ed()}<b>${fd(e.date)}</b> ${fh(e.hours)}${e.intensity?` <span class=m>· ${IVN[e.intensity]}</span>`:''}${g.length>1?` <span class=m>of ${fh(g.reduce((a,x)=>a+x.hours,0))} · with ${o}</span>`:''}${e.about&&e.about!='general'?` <span class=m>[${e.about}]</span>`:''}${e.note?`<br>${esc(e.note)}`:''}${ctxS(e)}</div></div>`}).join('')+(L.length>sl?'<button onclick="sl+=50;render()">Show more</button>':'')||'<p class=m>No sessions yet</p>'}
else if(tab=='N'){const T=[];E.filter(e=>!isS(e)).forEach(e=>T.push({d:e.date,e,h:`<div class=ti onclick="editE('${e.id}')">${phL(e)}<div class=tt>${ed()}<b>${fd(e.date)}</b> ${e.hours!=null?fh(e.hours)+' ':''}${e.about!='general'?`<span class=m>[${e.about}]</span>`:''}<br>${e.body?`<b>${bsum(e.body)}</b>${e.shared?' <span class=m>shared</span>':''}${e.note?'<br>':''}`:''}${esc(e.note||'')}${ctx(e)}${phB(e)}</div></div>`}));
db.stringJobs.filter(j=>j.racketId==id).forEach(j=>T.push({d:j.startDate,h:`<div onclick="editJ('s','${j.id}')">${ed()}<b>${fd(j.startDate)}</b> Strung<br>${sTxt(j)}</div>`}));
db.overgripJobs.filter(j=>j.racketId==id).forEach(j=>T.push({d:j.startDate,h:`<div onclick="editJ('g','${j.id}')">${ed()}<b>${fd(j.startDate)}</b> New overgrip: ${esc(j.model)}</div>`}));
body=(T.sort(cmpT).map(x=>`<div class=tl>${x.h}</div>`).join('')||'<p class=m>No notes yet</p>')}
else{const hist=(a,f)=>db[a].filter(j=>j.racketId==id).sort((x,y)=>y.startDate>x.startDate?1:-1).map(j=>`<div class="tl ti" onclick="editJ('${a=='stringJobs'?'s':'g'}','${j.id}')">${ph(j,'th z')}<div class=tt>${ed()}<b>${fd(j.startDate)} → ${j.endDate?fd(j.endDate):'present'}</b> · ${fh(H(e=>e[f]==j.id))}<br>${a=='stringJobs'?sTxt(j):esc(j.model)}${j.notes?`<br><span class=m>${esc(j.notes)}</span>`:''}</div></div>`).join('')||'<p class=m>None yet</p>';
const cmp={};db.stringJobs.filter(j=>j.racketId==id).forEach(j=>{const k=`${j.mains.model} @ ${j.mains.tensionKg} kg / ${j.crosses.model} @ ${j.crosses.tensionKg} kg`,x=cmp[k]||(cmp[k]={h:0,n:0,d:'',s:0,iv:[0,0,0,0],c:0,t:{},m:{},p:{},f:0,sh:0});x.h+=H(e=>e.stringJobId==j.id);x.n++;if(j.startDate>x.d)x.d=j.startDate;E.forEach(e=>{if(e.stringJobId!=j.id)return;if(isS(e)){x.s++;x.iv[e.intensity||0]+=e.hours}if(e.body){x.c++;if(e.shared)x.sh++;let fl=0;for(const q in JN)if(e.body[q]!=null){x.t[q]=(x.t[q]||0)+e.body[q];x.m[q]=(x.m[q]||0)+1;x.p[q]=Math.max(x.p[q]||0,e.body[q]);if(e.body[q]>=FLARE)fl=1}x.f+=fl}})});
body=`<h3 style="margin-top:12px">String history</h3>${hist('stringJobs','stringJobId')}<h3>Overgrip history</h3>${hist('overgripJobs','overgripJobId')}<h3>Hours per setup</h3>${Object.entries(cmp).sort((x,y)=>y[1].d>x[1].d?1:-1).map(([k,x])=>`<p>${esc(k)}<br><b>${fh(x.h)}</b> over ${x.n} job${x.n>1?'s':''}${ivT(x)}${x.c?`<br><span style="display:block;margin-top:4px">${Object.entries(JN).filter(([q])=>x.m[q]).map(([q,n])=>bar2(n,x.t[q]/x.m[q],x.p[q])).join('')}</span><span class=m>${x.c} check-in${x.c>1?'s':''}${x.sh?` (${x.sh} shared)`:''} · ${x.f} flare${x.f==1?'':'s'} (≥${FLARE}) · ${x.s} sessions</span>`:''}</p>`).join('')||'<p class=m>None yet</p>'}`}
return `${head(r)}<div class=row style="position:sticky;top:calc(env(safe-area-inset-top) + 72px);background:var(--bg);padding:8px 0;z-index:1">${[['S','Sessions'],['N','Notes & events'],['U','Setups']].slice(0,r.sport=='padel'?2:3).map(([k,l])=>`<button class="chip ${k==tab?'on':''}" onclick="tab='${k}';render()">${l}</button>`).join('')}</div>${body}`}
function render(){const m=$('#m'),B=view=='body',r=!B&&view&&R(view);$('header').innerHTML=B?`<button class=fb aria-label=Back onclick="history.back()">←</button><span style="flex:1"></span><button class="p pl" aria-label="Body check-in" onclick="bodyF()">+ 💪</button>`:r?`<button class=fb aria-label=Back onclick="history.back()">←</button><span style="flex:1"></span><button class="p pl" aria-label="Log session" onclick="sessF('${r.id}')">+ 🎾</button><button class=pl aria-label="Add note" onclick="logF('${r.id}')">+ 📝</button><button class=fb aria-label="More" onclick="menu('${r.id}')">🔧</button>`:`<h1>Racket Tracker</h1><button class=p aria-label="Log session" onclick="sessF()">+ 🎾</button><button aria-label="Body check-in" onclick="bodyF()">+ 💪</button><button onclick=settings()>⚙</button>`;m.innerHTML=B?bodyView():r?detail(view):(mainList()||'<p class=m>Open ⚙ → Add racket to start.</p>');hyd(document)}
const rk=()=>db.rackets.filter(r=>!r.archivedAt);
function settings(){sh.hidden=false;sh.innerHTML=`<div class=bx><button class=p onclick="rackF()">+ Add racket</button><h3>Backup</h3><p class=m>Last backup: ${db.settings.lastBackupAt?.slice(0,10)||'never'}<br>Schema v${db.schemaVersion}</p><button class=p onclick="exp(1)">Export with photos</button> <button onclick="exp(0)">Export without</button><label>Import backup (replaces current data)</label><input type=file accept=.json onchange="imp(this.files[0])"></div>`}
async function exp(withP){const d=JSON.parse(JSON.stringify(db));d.exportedAt=now();if(withP){const k=await tx('ph','readonly',o=>o.getAllKeys()),v=await tx('ph','readonly',o=>o.getAll());d.photos=Object.fromEntries(k.map((x,i)=>[x,v[i]]))}
const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(d)],{type:'application/json'}));a.download='racket-tracker-'+today()+'.json';a.click();db.settings.lastBackupAt=now();await save();close()}
async function imp(f){if(!f||!confirm('Replace all current data?'))return;try{let d=JSON.parse(await f.text());if(d.app!='racket-tracker'||d.schemaVersion>CUR)throw 0;for(const[k,v]of Object.entries(d.photos||{}))await tx('ph','readwrite',o=>o.put(v,k));delete d.photos;db=migrate(d);await save();close();view=null;render()}catch{alert('Not a valid backup for this app version')}}
history.replaceState({v:null},'');addEventListener('popstate',e=>{if(!zm.hidden||!sh.hidden){zm.hidden=true;zm.innerHTML='';close();history.pushState({v:view},'');return}view=e.state?.v??null;tab='S';bt='C';render()});
(async()=>{db=migrate(await tx('kv','readonly',o=>o.get('data'))||newDb());norm();navigator.storage?.persist?.();navigator.serviceWorker?.register('sw.js');render()})();
